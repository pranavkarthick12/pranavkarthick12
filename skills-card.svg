<svg xmlns="http://www.w3.org/2000/svg" width="850" height="480" viewBox="0 0 850 480" fill="none">
  <defs>
    <!-- Dark Glass Background -->
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <!-- Light Glass Background -->
    <linearGradient id="bgLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.04"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.015"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Subtle Static Glass Border -->
    <linearGradient id="borderGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12"/>
    </linearGradient>

    <linearGradient id="borderGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.12"/>
    </linearGradient>

    <!-- Outer Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .card-bg {
      fill: url(#bgDark);
      stroke: url(#borderGradDark);
    }
    .text-title {
      fill: #f0f6fc;
      font-size: 20px;
      font-weight: 700;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .text-subtitle {
      fill: #e6edf3;
      font-size: 15px;
      font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .text-body {
      fill: #8b949e;
      font-size: 13.5px;
      font-weight: 400;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .text-strong {
      fill: #c9d1d9;
      font-weight: 600;
    }
    .text-accent {
      fill: #58a6ff;
      font-weight: 600;
    }
    .bullet {
      fill: #3b82f6;
    }
    .row-line {
      stroke: #30363d;
      stroke-width: 1;
    }
    .orbit-beam {
      stroke: #ffffff;
      stroke-width: 2.2;
      stroke-linecap: round;
      filter: url(#glow);
    }

    @media (prefers-color-scheme: light) {
      .card-bg {
        fill: url(#bgLight);
        stroke: url(#borderGradLight);
      }
      .text-title {
        fill: #1f2328;
      }
      .text-subtitle {
        fill: #24292f;
      }
      .text-body {
        fill: #57606a;
      }
      .text-strong {
        fill: #24292f;
      }
      .text-accent {
        fill: #0969da;
      }
      .bullet {
        fill: #2563eb;
      }
      .row-line {
        stroke: #d0d7de;
      }
      .orbit-beam {
        stroke: #2563eb;
      }
    }
  </style>

  <!-- Ambient Backdrop -->
  <rect x="2" y="2" width="846" height="476" rx="16" fill="none" opacity="0.4" />

  <!-- Glass Card Base -->
  <rect class="card-bg" x="2" y="2" width="846" height="476" rx="16" stroke-width="1.2" />

  <!-- White Orbiting Beam -->
  <rect x="2" y="2" width="846" height="476" rx="16" fill="none"
        class="orbit-beam" pathLength="1000"
        stroke-dasharray="140 860">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="7s" repeatCount="indefinite" />
  </rect>

  <!-- Content -->
  <g transform="translate(32, 28)">
    <text x="0" y="16" class="text-title">Technical Skills</text><text x="0" y="54" class="text-strong" font-size="14">Category</text><text x="240" y="54" class="text-strong" font-size="14">Technologies and Skills</text><line x1="0" y1="64" x2="786" y2="64" class="row-line" /><text x="0" y="90" class="text-strong">Programming Languages</text><text x="240" y="90" class="text-body">JavaScript, Python, Java, C++</text><line x1="0" y1="100" x2="786" y2="100" class="row-line" opacity="0.4" /><text x="0" y="126" class="text-strong">Frontend Development</text><text x="240" y="126" class="text-body">React.js, HTML5, CSS3, Redux Toolkit</text><line x1="0" y1="136" x2="786" y2="136" class="row-line" opacity="0.4" /><text x="0" y="162" class="text-strong">Backend Development</text><text x="240" y="162" class="text-body">Node.js, Express.js, Spring Boot, Flask, REST APIs</text><line x1="0" y1="172" x2="786" y2="172" class="row-line" opacity="0.4" /><text x="0" y="198" class="text-strong">Databases</text><text x="240" y="198" class="text-body">MongoDB, MySQL</text><line x1="0" y1="208" x2="786" y2="208" class="row-line" opacity="0.4" /><text x="0" y="234" class="text-strong">Core Concepts</text><text x="240" y="234" class="text-body">DBMS, OOP, Data Structures and Algorithms, Operating Systems</text><line x1="0" y1="244" x2="786" y2="244" class="row-line" opacity="0.4" /><text x="0" y="270" class="text-strong">AI-Assisted Development</text><text x="240" y="270" class="text-body">Claude, ChatGPT, Antigravity, AI-assisted development workflows</text><line x1="0" y1="280" x2="786" y2="280" class="row-line" opacity="0.4" /><text x="0" y="306" class="text-strong">Testing & Quality</text><text x="240" y="306" class="text-body">Playwright, Selenium, Accessibility Testing, Debugging</text><line x1="0" y1="316" x2="786" y2="316" class="row-line" opacity="0.4" /><text x="0" y="342" class="text-strong">Libraries</text><text x="240" y="342" class="text-body">Pandas, NumPy, Scikit-learn</text><line x1="0" y1="352" x2="786" y2="352" class="row-line" opacity="0.4" /><text x="0" y="378" class="text-strong">Cloud & Deployment</text><text x="240" y="378" class="text-body">AWS, Docker, Vercel</text><line x1="0" y1="388" x2="786" y2="388" class="row-line" opacity="0.4" /><text x="0" y="414" class="text-strong">Tools</text><text x="240" y="414" class="text-body">Git, GitHub, VS Code</text><line x1="0" y1="424" x2="786" y2="424" class="row-line" opacity="0.4" />
  </g>
</svg>